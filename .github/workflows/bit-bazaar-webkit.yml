name: Bit Bazaar mobile WebKit acceptance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: bit-bazaar-webkit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile-webkit:
    name: Automated iPhone-shaped WebKit and Files QA
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scripts and install the matching Playwright API
        run: |
          node --check tests/browser-phase4.mjs
          node --check tests/browser-phase5.mjs
          node --check tests/browser-phase6.mjs
          node --check tests/browser-phase6-journeys.mjs
          node --check tests/browser-phase6-achievements.mjs
          node --check tests/browser-server.mjs
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Launch local game with dependency-free test server
        run: |
          node tests/browser-server.mjs > /tmp/bit-bazaar-browser.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bit-bazaar-browser.log
          exit 1
      - name: Run WebKit touch-browser gameplay and backup acceptance
        env:
          BIT_BAZAAR_TEST_URL: http://127.0.0.1:4173/
        run: |
          node tests/browser-phase4.mjs
          node tests/browser-phase5.mjs
          node tests/browser-phase6.mjs
          node tests/browser-phase6-journeys.mjs
          node tests/browser-phase6-achievements.mjs
      - name: Show local server diagnostics on failure
        if: failure()
        run: tail -n 100 /tmp/bit-bazaar-browser.log || true
