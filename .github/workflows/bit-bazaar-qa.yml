name: Bit Bazaar safety checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check both engines and precision placement scripts
        run: |
          node --check game-v0.38.0.js
          node --check game-v0.38.0-lowfx.js
          node --check assets/decor-workshop-v0.38.js
          node --check assets/decor-map-v0.38.js
          node --check assets/decor-runtime-v0.37.js
          node --check assets/decor-art-v0.37.js
          node --check assets/decor-world-v0.29.js
          node --check assets/save-manager-v0.29.js
          node --check sw.js
          node --check tests/phase4-v031.test.cjs
          node --check tests/phase4-v032.test.cjs
          node --check tests/phase4-v033.test.cjs
          node --check tests/phase4-v034.test.cjs
          node --check tests/phase4-v035.test.cjs
          node --check tests/phase4-v036.test.cjs
          node --check tests/phase4-v037.test.cjs
          node --check tests/phase4-v038.test.cjs
      - name: Historical v0.31 art-map and previews
        run: node tests/phase4-v031.test.cjs
      - name: Historical v0.32 artwork placement
        run: node tests/phase4-v032.test.cjs
      - name: Historical v0.33 original pixel art and previews
        run: node tests/phase4-v033.test.cjs
      - name: Historical v0.34 three-row sacrifice
        run: node tests/phase4-v034.test.cjs
      - name: Historical v0.35 four-row sacrifice
        run: node tests/phase4-v035.test.cjs
      - name: Historical v0.36 five-row sacrifice and catalog search
        run: node tests/phase4-v036.test.cjs
      - name: Complete v0.37 180-piece catalog and six-row sacrifice
        run: node tests/phase4-v037.test.cjs
      - name: v0.38 precision editor, collisions, cancel and save/reload compatibility
        run: node tests/phase4-v038.test.cjs
      - name: Validate main, Low FX, preview, map and PWA version alignment
        run: |
          test -f index.html
          test -f preview-v0.38.0.html
          test -f baseline-v0.38.0-lowfx.html
          test -f style-v0.38.0.css
          grep -q 'game-v0.38.0.js' index.html
          grep -q 'game-v0.38.0-lowfx.js' baseline-v0.38.0-lowfx.html
          grep -q 'decor-workshop-v0.38.js' index.html
          grep -q 'decor-map-v0.38.js' index.html
          grep -q 'decor-art-v0.37.js' index.html
          grep -q 'bit-bazaar-v0.38.0' sw.js
