name: Bit Bazaar safety checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check game-v0.31.0.js
          node --check game-v0.31.0-lowfx.js
          node --check assets/decor-runtime-v0.31.js
          node --check assets/decor-map-v0.31.js
          node --check assets/decor-world-v0.29.js
          node --check assets/save-manager-v0.29.js
          node --check sw.js
      - name: Phase 4 regression checks
        run: node tests/phase4-v031.test.cjs
      - name: Required release assets
        run: |
          test -f index.html
          test -f preview-v0.31.0.html
          test -f baseline-v0.31.0-lowfx.html
          test -f style-v0.31.0.css
          grep -q 'game-v0.31.0.js' index.html
          grep -q 'game-v0.31.0-lowfx.js' baseline-v0.31.0-lowfx.html
          grep -q 'decor-map-v0.31.js' index.html
          grep -q 'decor-runtime-v0.31.js' index.html
          grep -q 'decorPreviewHud' index.html
          grep -q 'bit-bazaar-v0.31.0' sw.js
