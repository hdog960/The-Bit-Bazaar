name: Bit Bazaar safety checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check standard and Low FX visual occlusion and all regression scripts
        run: |
          node --check game-v0.54.0.js
          node --check game-v0.54.0-lowfx.js
          node --check assets/decor-runtime-v0.46.js
          node --check assets/decor-runtime-v0.48.js
          node --check assets/decor-runtime-v0.52.js
          node --check assets/decor-workshop-v0.46.js
          node --check assets/room-workshop-v0.46.js
          node --check assets/decor-visibility-v0.41.js
          node --check assets/decor-runtime-v0.41.js
          node --check assets/decor-workshop-v0.38.js
          node --check assets/decor-map-v0.38.js
          node --check assets/decor-world-v0.41.js
          node --check assets/decor-art-v0.37.js
          node --check assets/save-manager-v0.43.js
          node --check assets/save-manager-v0.45.js
          node --check assets/save-manager-v0.47.js
          node --check assets/save-manager-v0.49.js
          node --check assets/save-manager-v0.53.js
          node --check assets/save-manager-v0.54.js
          node --check assets/cowards-glasses-v0.54.js
          node --check assets/boot-recovery-v0.49.js
          node --check assets/boot-recovery-v0.50.js
          node --check assets/figure-integrity-v0.43.js
          node --check assets/device-qa-v0.44.js
          node --check assets/device-qa-v0.52.js
          node --check sw.js
          node --check tests/phase4-v031.test.cjs
          node --check tests/phase4-v032.test.cjs
          node --check tests/phase4-v033.test.cjs
          node --check tests/phase4-v034.test.cjs
          node --check tests/phase4-v035.test.cjs
          node --check tests/phase4-v036.test.cjs
          node --check tests/phase4-v037.test.cjs
          node --check tests/phase4-v038.test.cjs
          node --check tests/phase4-v039.test.cjs
          node --check tests/phase4-v040.test.cjs
          node --check tests/phase4-v041.test.cjs
          node --check tests/phase4-v042.test.cjs
          node --check tests/phase4-v043.test.cjs
          node --check tests/phase4-v044.test.cjs
          node --check tests/phase4-v045.test.cjs
          node --check tests/phase4-v046.test.cjs
          node --check tests/phase4-v047.test.cjs
          node --check tests/phase4-v048.test.cjs
          node --check tests/phase4-v049.test.cjs
          node --check tests/phase4-v050.test.cjs
          node --check tests/phase4-v051.test.cjs
          node --check tests/phase4-v052.test.cjs
          node --check tests/phase4-v052-telemetry.test.cjs
          node --check tests/phase4-v053.test.cjs
          node --check tests/catalog-loading-v0531.test.cjs
          node --check tests/phase5-v054.test.cjs
      - name: Historical v0.31 world relocation and figure priority
        run: node tests/phase4-v031.test.cjs
      - name: Historical v0.32 original art and space preservation
        run: node tests/phase4-v032.test.cjs
      - name: Historical v0.33 preview cancellation
        run: node tests/phase4-v033.test.cjs
      - name: Historical v0.34 three-row sacrifice
        run: node tests/phase4-v034.test.cjs
      - name: Historical v0.35 four-row sacrifice
        run: node tests/phase4-v035.test.cjs
      - name: Historical v0.36 five-row sacrifice
        run: node tests/phase4-v036.test.cjs
      - name: Historical v0.37 all 180 original artwork quotas
        run: node tests/phase4-v037.test.cjs
      - name: Historical v0.38 safe precision placement
        run: node tests/phase4-v038.test.cjs
      - name: Historical v0.39 dense-gallery performance
        run: node tests/phase4-v039.test.cjs
      - name: v0.40 shared physical occlusion for world rendering and reticle
        run: node tests/phase4-v040.test.cjs
      - name: v0.41 partial decorations, hidden strips and exposed reticle
        run: node tests/phase4-v041.test.cjs
      - name: v0.42 verified backups, extended art offsets and rollback
        run: node tests/phase4-v042.test.cjs
      - name: v0.43 audit all 3,000 objects, hidden figures and floor pickup consistency
        run: node tests/phase4-v043.test.cjs
      - name: v0.44 opt-in device frame report
        run: node tests/phase4-v044.test.cjs
      - name: v0.45 native iPhone Files backup and recovery
        run: node tests/phase4-v045.test.cjs
      - name: v0.46 atomic decoration move, store, precision and room-save recovery
        run: node tests/phase4-v046.test.cjs
      - name: v0.47 validate before writing and preserve last good save
        run: node tests/phase4-v047.test.cjs
      - name: v0.48 sacrifice transactions honor quarantine and validate candidate
        run: node tests/phase4-v048.test.cjs
      - name: v0.49 non-destructive corrupt startup save recovery
        run: node tests/phase4-v049.test.cjs
      - name: v0.50 deep startup validation with legacy migration preservation
        run: node tests/phase4-v050.test.cjs
      - name: v0.51 transactional restore and migration guard
        run: node tests/phase4-v051.test.cjs
      - name: v0.52 budget-first dense-gallery occlusion and real-device QA
        run: |
          node tests/phase4-v052.test.cjs
          node tests/phase4-v052-telemetry.test.cjs
      - name: v0.53 read-only Files backup round-trip checker
        run: node tests/phase4-v053.test.cjs
      - name: v0.53.1 original 180-art dependency load order
        run: node tests/catalog-loading-v0531.test.cjs
      - name: v0.54 Coward's Glasses lifetime unlock, guidance and save persistence
        run: node tests/phase5-v054.test.cjs
      - name: Validate all iPhone entrypoints and v0.54.0 offline cache
        run: |
          test -f index.html
          test -f preview-v0.54.0.html
          test -f baseline-v0.54.0-lowfx.html
          test -f style-v0.54.0.css
          grep -q 'game-v0.54.0.js' index.html
          grep -q 'game-v0.54.0-lowfx.js' baseline-v0.54.0-lowfx.html
          test -f assets/decor-runtime-v0.41.js
          grep -q 'decor-visibility-v0.41.js' index.html
          grep -q 'decor-art-v0.37.js' index.html
          test -f assets/save-manager-v0.43.js
          grep -q 'figure-integrity-v0.43.js' index.html
          grep -q 'bit-bazaar-v0.54.0' sw.js
          test -f assets/device-qa-v0.44.js
          test -f assets/save-manager-v0.45.js
          test -f assets/save-manager-v0.47.js
          grep -q 'save-manager-v0.54.js' index.html
          grep -q 'cowards-glasses-v0.54.js' index.html
          test -f assets/save-manager-v0.53.js
          test -f assets/save-manager-v0.49.js
          grep -q 'boot-recovery-v0.50.js' index.html
          grep -q 'save-manager-v0.54.js' sw.js
          grep -q 'cowards-glasses-v0.54.js' sw.js
          grep -q 'save-manager-v0.53.js' sw.js
          grep -q 'save-manager-v0.49.js' sw.js
          grep -q 'boot-recovery-v0.50.js' sw.js
          grep -q 'boot-recovery-v0.49.js' sw.js
          grep -q 'decor-workshop-v0.46.js' index.html
          grep -q 'room-workshop-v0.46.js' index.html
          grep -q 'decor-runtime-v0.52.js' index.html
          grep -q 'device-qa-v0.52.js' index.html
          grep -q 'decor-runtime-v0.52.js' sw.js
          grep -q 'device-qa-v0.52.js' sw.js
          test -f assets/decor-runtime-v0.48.js
          test -f assets/decor-runtime-v0.46.js
